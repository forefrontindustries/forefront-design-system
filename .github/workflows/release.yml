name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version pull request or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      # Never publish an artifact set that was not regenerated and re-gated.
      - run: bun run tokens:validate
      - run: bun run tokens:build
      - run: bun run tokens:contrast
      - run: bun run lint:tokens
      - run: bun run typecheck

      # Opens or updates the version pull request when changesets are pending.
      # Merging it applies the version bumps and writes CHANGELOG.md. Registry
      # publishing is deliberately not wired up: the packages are consumed from
      # the repo, so adding a publish step would need an NPM_TOKEN secret and a
      # release line decision that has not been made yet.
      - name: Changesets
        uses: changesets/action@v1
        with:
          version: bun run changeset version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
