name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokens:
    name: Token gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # Structure before output: tiers, naming, alias chains, theme completeness.
      - name: Validate token source
        run: bun run tokens:validate

      # Emits all seven platform artifacts plus manifest.json.
      - name: Build tokens
        run: bun run tokens:build

      # WCAG 2.2 AA across every theme. A failing pair fails the build.
      - name: Contrast gate
        run: bun run tokens:contrast

      # No literal colour, length, or duration values in component or docs CSS.
      - name: Literal value lint
        run: bun run lint:tokens

      # The generated artifacts are committed, so a stale build is a failure.
      - name: Fail on stale generated artifacts
        run: |
          if [ -n "$(git status --porcelain packages/tokens/build)" ]; then
            echo "::error::Generated token artifacts are out of date. Run 'bun run tokens:build' and commit the result."
            git --no-pager diff --stat packages/tokens/build
            exit 1
          fi

  quality:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run tokens:build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build

  storybook:
    name: Storybook and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run tokens:build

      # The a11y addon runs in error mode, so an axe violation in any story fails here.
      - name: Build Storybook
        working-directory: packages/ui
        run: bun run build-storybook

      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          retention-days: 7

  changeset:
    name: Changeset present
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a changeset for published package changes
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          TOUCHED_PKG=$(echo "$CHANGED" | grep -E '^packages/(tokens|ui)/' | grep -v '/build/' || true)
          HAS_CHANGESET=$(echo "$CHANGED" | grep -E '^\.changeset/.*\.md$' | grep -v 'README' || true)
          if [ -n "$TOUCHED_PKG" ] && [ -z "$HAS_CHANGESET" ]; then
            echo "::error::This pull request changes a published package with no changeset. Run 'bunx changeset'. See VERSIONING.md."
            exit 1
          fi
          echo "changeset check ok"
