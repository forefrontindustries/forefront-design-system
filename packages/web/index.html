		<link rel="icon" href="/favicon.ico" />
		<title>Forefront Design System</title>
		<meta
			name="description"
			content="A production design system: DTCG token pipeline, four themes from one contract, and twelve hand-built accessible React components with generated API documentation."

		     library that injects @font-face rules takes a decision that belongs to the
		     application and breaks under a strict CSP. -->

		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Instrument+Serif:ital@0;1&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
	</head>

		<div id="root"></div>
